worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 80;

    # SECURITY: same-origin BFF (INV-16) - the SPA and the backend it talks
    # to are served under ONE origin here, matching web/vite.config.ts's own
    # dev-server proxy for exactly the same reason (SameSite=Strict session/
    # CSRF cookies would never be sent cross-origin). `monolith` is this
    # compose file's own service name (Docker's embedded DNS resolves it).
    location /v1/ {
      proxy_pass http://monolith:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Skill packages are uploaded through here. nginx's 1m default would
      # reject larger ones with a 413 that looks like a client bug. Kept in
      # parity with deploy/helm/skillscan/templates/web.yaml's
      # client_max_body_size (web.maxUploadSize, 64m by default).
      client_max_body_size 64m;
    }

    # /.well-known/jwks.json is fetched by an external client (the
    # marketplace, INV-13 signature verification) over the network, not by
    # an in-cluster probe - the same OIDC-discovery shape as /v1/, so it
    # gets the same forwarded-identity headers. `gate/signer.py`'s jwks()
    # does not read Host/X-Real-IP/X-Forwarded-* today (checked, not
    # assumed), so this is provenance for future logging/anomaly-detection
    # use, not a functional dependency - kept in parity with
    # deploy/helm/skillscan/templates/web.yaml's combined regex location,
    # which already forwards these here.
    location /.well-known/ {
      proxy_pass http://monolith:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /healthz and /readyz are liveness/readiness probes, consumed only by
    # the orchestrator (a container HEALTHCHECK here; kubelet on the Helm
    # path) - never a browser or an external client. Deliberately NOT
    # forwarding Host/X-Real-IP/X-Forwarded-* here, unlike /v1/ and
    # /.well-known/ above: `infra_router.healthz()` takes no `Request`
    # parameter at all (cannot read a header even if forwarded), and
    # `infra_router.readyz()` only checks redis/orchestration_db/blobstore -
    # neither handler has ever read a forwarded header (checked, not
    # assumed). The Helm chart's ConfigMap forwards them here too, but only
    # as a byproduct of covering v1|healthz|readyz|.well-known with one
    # combined regex location, not as a per-path decision - see
    # deploy/check_nginx_parity.py, which documents and asserts this exact
    # divergence rather than silently allowing it to drift further.
    location /healthz {
      proxy_pass http://monolith:8000;
    }

    location /readyz {
      proxy_pass http://monolith:8000;
    }

    # SPA fallback - client-side routing (react-router) owns any path nginx
    # doesn't otherwise recognize as a static asset.
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
