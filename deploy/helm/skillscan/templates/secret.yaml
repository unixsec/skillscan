{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretRefs.name }}
  labels:
    {{- include "skillscan.labels" . | nindent 4 }}
  annotations:
    # 升级时保留已生成的口令：lookup 读取集群里现有的 Secret，
    # 没有 lookup 的话每次 helm upgrade 都会换一批口令，
    # 而 MySQL 里的用户口令不会跟着变 —— 应用随即全部连不上。
    "helm.sh/resource-policy": keep
type: Opaque
data:
{{- $existing := (lookup "v1" "Secret" .Release.Namespace .Values.secretRefs.name) }}
{{- range .Values.secretRefs.keys }}
  {{- $k := . }}
  {{ $k }}: {{ if $existing }}{{ index $existing.data $k | default (randAlphaNum 24 | b64enc) }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
{{- end }}
  MYSQL_ROOT_PASSWORD: {{ if $existing }}{{ index $existing.data "MYSQL_ROOT_PASSWORD" | default (randAlphaNum 24 | b64enc) }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
{{- /*
  The first-admin seed. NOT a member of secretRefs.keys above: everything in
  that list is a random password the chart may invent, and this key is a JSON
  document the chart CANNOT invent - the account list carries scrypt hashes,
  and Helm has no scrypt. Generated as randAlphaNum 24 (which is what being in
  that list meant), it reached the monolith as SKILLSCAN_LOCAL_ACCOUNTS_JSON
  and load_local_accounts_from_json rejected it - "is not valid JSON" - on
  every boot, so the install came up with no way to log in and no obvious
  reason why.

  Empty + localAuthEnabled is a `fail` at render time rather than a
  CrashLoopBackOff ten minutes into an install: nothing is created, and the
  message says exactly what to produce. INV-17 forbids inventing a default
  account here, so there is nothing else this can honestly do.
*/ -}}
{{- $seedKey := "SKILLSCAN_LOCAL_ACCOUNTS_JSON" }}
{{- $existingSeed := "" }}
{{- if $existing }}{{ $existingSeed = (index $existing.data $seedKey | default "") }}{{ end }}
{{- if .Values.localAccounts.seed }}
  {{ $seedKey }}: {{ .Values.localAccounts.seed | toJson | b64enc }}
{{- else if $existingSeed }}
  {{ $seedKey }}: {{ $existingSeed }}
{{- else if .Values.config.localAuthEnabled }}
  {{- fail (printf "config.localAuthEnabled is true but localAccounts.seed is empty, and Secret %q carries no %s yet.\nThe monolith cannot bootstrap a first admin without it and exits at startup.\nProduce a password hash with the scrypt snippet in docs/DEPLOYMENT_GUIDE.md 6.9, then either put the account list in your values file (see values.yaml localAccounts) or pass it inline:\n  --set-json 'localAccounts.seed=[{\"username\":\"admin\",\"password_hash\":\"scrypt$SALT$DIGEST\",\"role\":\"admin\"}]'\nSet config.localAuthEnabled=false instead if this deployment authenticates through an external IdP." .Values.secretRefs.name $seedKey) }}
{{- end }}
{{- end }}
