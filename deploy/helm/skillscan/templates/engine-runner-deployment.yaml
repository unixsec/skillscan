# engine-runner (sandbox, coding spec §10/§11.7): gVisor RuntimeClass, no
# ServiceAccount token, no DB/Vault credentials at all (INV-10) - reads/writes
# only via the airlock (Redis control plane + MinIO payload plane), never
# directly to the monolith or its DB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillscan-engine-runner
  labels:
    {{- include "skillscan.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine-runner
spec:
  replicas: {{ .Values.replicaCount.engineRunner }}
  selector:
    matchLabels:
      app.kubernetes.io/name: skillscan
      app.kubernetes.io/component: engine-runner
  template:
    metadata:
      labels:
        {{- include "skillscan.labels" . | nindent 8 }}
        app.kubernetes.io/component: engine-runner
    spec:
      runtimeClassName: {{ .Values.runtimeClass.engineRunner }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # See the matching comment in monolith-deployment.yaml: without this,
        # `runAsNonRoot: true` fails closed at admission ("image has
        # non-numeric user (engine-runner), cannot verify user is non-root")
        # since this Dockerfile's `USER engine-runner` is a name, not a uid -
        # confirmed live against the real k3s cluster, not by inspection.
        # Matches the Dockerfile's real `useradd --uid 10002 engine-runner`.
        runAsUser: 10002
        # See the matching comment in monolith-deployment.yaml: this fsGroup
        # must stay identical to that one's, so a shared hostPath blobstore
        # (the VM/dev fallback when MinIO isn't provisioned) is writable by
        # both this uid (10002) and the monolith's (10001) without collapsing
        # either identity. Only matters for the hostPath fallback - the
        # intended MinIO-backed production path has no Unix permission model
        # to race on in the first place.
        fsGroup: 10000
      containers:
        - name: engine-runner
          image: {{ include "skillscan.image" (dict "root" $ "repo" .Values.image.engineRunnerRepository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          env:
            {{- if .Values.redis.enabled }}
            # SECURITY: same override as monolith-deployment.yaml - the
            # chart's own Redis requires auth (see redis.yaml), so build an
            # authenticated URL from config.redisUrl's host/port/db plus the
            # Secret's password rather than using the plain ConfigMap value.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRefs.name }}
                  key: SKILLSCAN_REDIS_PASSWORD
            {{- $redisUrl := urlParse .Values.config.redisUrl }}
            - name: SKILLSCAN_REDIS_URL
              value: "{{ $redisUrl.scheme }}://:$(REDIS_PASSWORD)@{{ $redisUrl.host }}{{ $redisUrl.path }}"
            {{- else }}
            - name: SKILLSCAN_REDIS_URL
              valueFrom:
                configMapKeyRef: { name: skillscan-config, key: SKILLSCAN_REDIS_URL }
            {{- end }}
            # ⚠ LOAD-BEARING (M-E design §4). This Deployment lists its env
            # individually and has no `envFrom`, so - unlike the monolith,
            # which picks the key up from skillscan-config wholesale - leaving
            # this out does NOT produce an error. main.py falls back to a
            # default root, each pod quietly uses its own directory, monolith
            # and engine-runner never see each other's blobs, and every scan
            # sits in RUNNING forever with all pods Running and every health
            # check green. Sourced from the same ConfigMap key the monolith
            # gets, so the two cannot drift apart.
            - name: SKILLSCAN_BLOBSTORE_ROOT
              valueFrom:
                configMapKeyRef: { name: skillscan-config, key: SKILLSCAN_BLOBSTORE_ROOT }
            # Kept explicit rather than left to main.py's default, so this
            # value and the containerPort/readinessProbe below cannot disagree.
            - name: SKILLSCAN_ENGINE_RUNNER_READY_PORT
              value: {{ .Values.engineRunner.readyPort | quote }}
            - name: SKILLSCAN_VLLM_BASE_URL
              valueFrom:
                configMapKeyRef: { name: skillscan-config, key: SKILLSCAN_VLLM_BASE_URL }
            - name: SKILLSCAN_OSV_SOURCE
              valueFrom:
                configMapKeyRef: { name: skillscan-config, key: SKILLSCAN_OSV_SOURCE }
            - name: SKILLSCAN_LLM_MODEL
              valueFrom:
                configMapKeyRef: { name: skillscan-config, key: SKILLSCAN_LLM_MODEL }
            # Per-engine subprocess timeouts (milestone C Task 4). This
            # Deployment has no `envFrom`, so - like SKILLSCAN_BLOBSTORE_ROOT
            # above - a key left out here is not an error, it silently falls
            # back to the code default and the ConfigMap value has no effect.
            # SKILLSCAN_SCAN_DEADLINE_S is read here ONLY to warn when the
            # timeouts cannot fit the monolith's per-job budget; it is the
            # monolith that enforces it.
            - name: SKILLSCAN_ENGINE_TIMEOUT_S
              valueFrom:
                configMapKeyRef: { name: skillscan-config, key: SKILLSCAN_ENGINE_TIMEOUT_S }
            - name: SKILLSCAN_ENGINE_TIMEOUTS_JSON
              valueFrom:
                configMapKeyRef: { name: skillscan-config, key: SKILLSCAN_ENGINE_TIMEOUTS_JSON }
            - name: SKILLSCAN_SCAN_DEADLINE_S
              valueFrom:
                configMapKeyRef: { name: skillscan-config, key: SKILLSCAN_SCAN_DEADLINE_S }
            # SECURITY (INV-10 note): the one Secret-sourced key in this
            # Deployment - see values.yaml's secretRefs entry for why this,
            # specifically, is the deliberate exception to "no DB/Vault
            # credentials at all" here. `optional: true` so a deployment
            # that hasn't provisioned this key (the default, safe state)
            # still starts cleanly - aig-mcp-scan's own placeholder-key
            # fallback handles an empty value, it doesn't crash on it.
            - name: SKILLSCAN_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRefs.name }}
                  key: SKILLSCAN_LLM_API_KEY
                  optional: true
          ports:
            # This process is a Redis consumer with no HTTP surface of its
            # own; the listener behind this port serves only GET /healthz and
            # GET /readyz (services/engine_runner/main.py). It exists so the
            # shared-blobstore self-check has somewhere to be asked from.
            - name: readyz
              containerPort: {{ .Values.engineRunner.readyPort }}
          resources:
            {{- toYaml .Values.resources.engineRunner | nindent 12 }}
          # The other half of the shared blobstore - same claim, same path as
          # monolith-deployment.yaml, both from
          # persistence.blobstore.mountPath. If these two paths ever differ the
          # manifests still render, still apply, and still run.
          volumeMounts:
            - name: blobstore
              mountPath: {{ .Values.persistence.blobstore.mountPath }}
            # ⚠ LOAD-BEARING with readOnlyRootFilesystem above. Every engine
            # adapter unpacks the package into a tempfile.TemporaryDirectory
            # before spawning its subprocess (adapters/base.py analyze()), and
            # with a read-only root and no writable /tmp that raises
            #   FileNotFoundError: No usable temporary directory found in
            #   ['/tmp', '/var/tmp', '/usr/tmp', '/app']
            # on EVERY tick. worker.py leaves the message unacked for
            # redelivery, so the pod stays Running and Ready, the log fills
            # with identical tracebacks, and the scan sits in `running`
            # forever - the same visible symptom as an unshared blobstore, from
            # a completely different cause. Measured on the dev VM; the
            # hand-built deployment never saw it because it sets no container
            # securityContext at all.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            # ⚠ Without this the self-check is inert: it would compute the
            # right answer and no one would ever ask for it. 503 here takes
            # this pod out of rotation and stalls a rolling update, which is
            # how a broken shared volume becomes visible instead of becoming a
            # queue of scans that never complete.
            #
            # No livenessProbe deliberately. /healthz is state-independent by
            # design (a broken volume must not get the pod killed - restarting
            # cannot fix a volume), and the readiness listener runs in its own
            # thread, so a liveness probe on it would report healthy even if
            # the consumer loop were wedged. It would add restart risk and
            # detect nothing.
            httpGet: { path: /readyz, port: readyz }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: blobstore
          persistentVolumeClaim:
            claimName: skillscan-blobstore
        # Scratch space for the engine subprocesses, thrown away with the pod.
        # NOT the blobstore: nothing here outlives a single analyze() call, and
        # putting engine scratch on the shared RWX volume would put untrusted
        # unpacked content where the monolith also reads.
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.engineRunner.tmpSizeLimit }}
