# Admission: reject unsigned images (coding spec §11.7: "准入: 签名镜像...";
# §SAD 7.2 CI license/signing gate - cosign signs every image this project
# builds, including each pin-digest OSS-engine image from M5's
# deploy/engines/<name>/Dockerfile).
#
# NOT VERIFIED: no real Kubernetes cluster + Kyverno admission controller
# available in this development environment - this policy has not been
# applied/tested here (same posture as deploy/networkpolicy/*.yaml).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
  annotations:
    policies.kyverno.io/title: Require Signed Images
    policies.kyverno.io/description: >-
      Every image in the skillscan namespace must be cosign-signed by the
      project's own signing key - unsigned images are rejected at admission.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - skillscan
      verifyImages:
        - imageReferences:
            - "*"
          attestors:
            - count: 1
              entries:
                - keys:
                    # SECURITY: placeholder public key - the real deployment
                    # injects this from the enterprise's own cosign keypair
                    # (never committed to this repo), same as every other
                    # secret this project handles (Vault-sourced, coding
                    # spec §13) - not a hardcoded credential.
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      REPLACE_WITH_ENTERPRISE_COSIGN_PUBLIC_KEY
                      -----END PUBLIC KEY-----
