# Admission: engine-runner/dynamic-sandbox pods must run under the gVisor
# RuntimeClass (coding spec §11.7/§10: "gvisor RuntimeClass"; INV-10/INV-11 -
# the sandbox is where untrusted Skill content is actually parsed/executed).
# Scoped only to the sandbox component - the core monolith intentionally runs
# under the default (non-gVisor) RuntimeClass, since it never parses
# untrusted content itself (INV-11).
#
# NOT VERIFIED: see require-signed-images.yaml's own note - no real cluster
# (and no gVisor RuntimeClass, Linux-only) available in this environment.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-gvisor-sandbox-runtimeclass
  annotations:
    policies.kyverno.io/title: Require gVisor RuntimeClass for the Sandbox
    policies.kyverno.io/description: >-
      Every engine-runner/dynamic-sandbox pod must set
      runtimeClassName: gvisor - the boundary that isolates untrusted Skill
      content execution from the host kernel.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-gvisor-runtimeclass
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - skillscan
              selector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - engine-runner
                      - dynamic-sandbox
      validate:
        message: "engine-runner/dynamic-sandbox pods must set runtimeClassName: gvisor."
        pattern:
          spec:
            runtimeClassName: gvisor
