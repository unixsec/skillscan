# Gate policy v1 (coding spec §11.6: "GatePolicy 从版本化 yaml 加载;每判定记
# policy_version;config-as-code, PR 评审"). This file's `version:` value is what
# every VerdictRow.policy_version records - bump it (new file, e.g. v2.yaml, or a
# reviewed edit) only via a deliberate, PR-reviewed change, never silently in place.
#
# ⚠ EVERY SETTING BELOW IS BOUND TO THE SCAN CACHE (milestone C Task 11, INV-7).
# `GatePolicy.cache_policy_version` hashes the PARSED policy - all of it - into
# the toolchain digest, so editing any value here invalidates every cached
# verdict and marks every published skill stale in `GET /v1/reeval`, whether or
# not `version:` is bumped. That is deliberate: a verdict adjudicated under a
# threshold you have since tightened is a stale verdict, and serving it is the
# failure this binding exists to prevent. Bump `version:` anyway when you edit -
# the version is what a verdict RECORDS, and a reader comparing two verdicts has
# only that.
#
# What is FREE, because the digest reads the parsed policy and not the bytes:
# comments (this file is mostly comment), reindenting, reordering any list,
# duplicating a tier override, `1` vs `1.0` in a weight, adding a key the parser
# ignores. What COSTS a re-evaluation: any change to a value the gate reads.
#
# OPERATIONAL NOTE: after a real edit, drain the resulting staleness through
# `reeval` (`GET /v1/reeval` lists it, `POST /v1/reeval/{skill_id}` re-queues)
# rather than waiting for organic re-submission - published verdicts are not
# re-adjudicated by the cache going cold, only by a rescan.
#
# required_engines: the floor engines (services/engine_runner/detectors/*.py +
# skillscan_core.StaticKeywordEngine) that INV-1 requires unconditionally, by their
# real `EngineMetadata.name` values - a scan missing any of these is not required_ok.
version: "v1"

required_engines:
  - static-keyword
  - inhouse-pii
  - inhouse-file-type
  - inhouse-crypto-weak
  - inhouse-toctou
  - inhouse-prompt-injection-zh
  - inhouse-jailbreak-inducement-zh
  # 2026-07-27: 随包 .mcp.json 是 Agent Skill 最直接的横向攻击面之一，
  # 此前完全无检测（FR-PAR-010/FR-DET-080 未实现）。与其余 floor 引擎同级：
  # 缺失即 fail-closed。检测器对畸形输入返回 Finding 而非抛异常。
  - inhouse-mcp-config
  # 2026-07-27: SKILL.md frontmatter 声明的 allowed-tools 此前从未被读取用于
  # 安全判定（唯一解析点只取 name 做展示，FR-PAR-013/FR-DET-050 未实现）。
  # 与其余 floor 引擎同级：缺失即 fail-closed，畸形输入返回 Finding 而非异常。
  - inhouse-skill-permissions

# hard_gate_rules: rule_ids that are unwaivable (INV-3/INV-8: allowlist can never
# suppress these, regardless of scope_type) - the PII/credential detectors'
# highest-confidence rules, config-as-code so this list is reviewable.
#
# NOTE (2026-07 FP-tuning): pii.credit_card was REMOVED from the hard gate. A
# regex+Luhn card match is high-value but NOT high-enough-confidence to be
# unwaivable/force-BLOCK: real skills carrying schema examples, sample data, and
# 16-digit IDs produced false BLOCKs. It remains a HIGH finding (-> REVIEW by
# default tier / BLOCK on public tier), so a genuine leaked PAN still surfaces
# for human adjudication - it just no longer auto-blocks unwaivably. us_ssn
# (a far more specific ddd-dd-dddd shape) stays a hard gate.
hard_gate_rules:
  - pii.us_ssn

review_confidence: 0.6
block_on_severity: CRITICAL
review_on_severity: HIGH

# tier_block_overrides: may only TIGHTEN (lower) the base block_on_severity per
# trust tier, never loosen it (skillscan_core.GatePolicy.__post_init__ enforces
# this at construction time regardless of what this file says).
tier_block_overrides:
  - tier: public
    severity: HIGH

allowlistable_max_severity: HIGH
fail_closed_verdict: BLOCK

# category_weights: per-DetectionCategory multiplier on the 0-100 score's
# penalty term (skillscan_core.CategoryWeights). Affects the SCORE only - never
# the verdict, which is decided from severity/confidence thresholds before any
# score is computed. Range [0.0, 10.0] per field; a negative value is refused
# at load time (it would make a finding RAISE the score).
#
# The score is persisted on every verdict, so the INV-7 cache must not keep
# serving scores computed under the old weights - see the ⚠ at the top of this
# file: an edit here invalidates the cache whether or not `version:` is bumped.
#
# Every field defaults to 1.0 and the whole section may be omitted (a policy
# file predating milestone C loads unchanged). Listed explicitly here, at the
# default, so the knob is discoverable rather than folklore - declaring all-1.0
# is indistinguishable from omitting the section, so writing it out changes no
# digest and no score.
category_weights:
  instruction: 1.0
  code: 1.0
  data_credential: 1.0
  network_intel: 1.0
  permission: 1.0
  file_package: 1.0
  supply_chain: 1.0
  bundled_component: 1.0
